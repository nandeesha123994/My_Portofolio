{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ post.title }} | Learning Logs</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
  <style>
    body {
      background-color: #1a1a1a;
      color: #e0e0e0;
      font-family: 'Poppins', sans-serif;
      margin: 0;
    }

    .article-container {
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .back-link {
      color: #888;
      text-decoration: none;
      display: inline-block;
      margin-bottom: 30px;
    }

    .back-link:hover {
      color: #fff;
    }

    .meta {
      color: #888;
      margin-bottom: 20px;
      font-size: 0.9rem;
    }

    h1 {
      color: #4CAF50;
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    .content {
      font-size: 1.1rem;
      line-height: 1.8;
      color: #d1d1d1;
    }

    .content h3 {
      color: #fff;
      margin-top: 30px;
      border-left: 4px solid #4CAF50;
      padding-left: 15px;
    }

    .content code {
      background: #333;
      padding: 2px 5px;
      border-radius: 4px;
      font-family: monospace;
      color: #ffab91;
    }

    .content pre {
      background: #252525;
      padding: 15px;
      border-radius: 8px;
      overflow-x: auto;
      border: 1px solid #444;
    }

    .footer-note {
      margin-top: 50px;
      padding-top: 20px;
      border-top: 1px solid #333;
      color: #666;
      font-style: italic;
    }
  </style>
</head>

<body>

  <div class="article-container">
    <a href="{% url 'learning_home' %}" class="back-link">&larr; Back to Logs</a>

    <div class="meta">
      <span><i class="far fa-calendar-alt"></i> {{ post.date }}</span>
      &nbsp;&bull;&nbsp;
      <span><i class="far fa-clock"></i> {{ post.read_time }}</span>
    </div>

    <h1>{{ post.title }}</h1>

    <div class="content">
      {{ post.content|safe }}
    </div>

    <div class="footer-note">
      <p>Thanks for reading! This post is part of my continuous learning journey.</p>
    </div>
  </div>

</body>

</html>
